name: Build and Sync Web Assets to Android

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/build-and-sync.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build web assets
        run: npm run build
      
      - name: Commit and push dist folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No changes in dist folder"
          else
            git commit -m "chore: update compiled web assets for Android [skip ci]"
            git push origin dev
          fi
