workflows:
  react-native-android:
    name: React Native Android (Manuale)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20.11.0 # Specifichiamo una versione stabile per npm 10/11
      vars:
        PACKAGE_NAME: "com.e621.seeker86"
    triggering:
      events: [] 
    scripts:
      - name: Install npm dependencies
        script: | 
          # Pulisce eventuali rimasugli e installa in modo pulito
          npm ci || npm install --legacy-peer-deps
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android (Unsigned APK)
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk

  react-native-ios:
    name: React Native iOS (Manuale)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "seeker86.xcworkspace"
        XCODE_SCHEME: "seeker86"
      node: 20.11.0
      xcode: latest
      cocoapods: default
    triggering:
      events: []
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS (Debug/Simulator)
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa